<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>~/entertainment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --bg: #0e0d0a;

    --text: #f1e5ca;
    --muted: #8d8878;

    --gold: #e7a83f;
    --gold-light: #ffd477;

    --orange: #c96f32;

    --green: #79955a;
    --green-light: #9fbf72;

    --line: #30291d;
}


/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(231,168,63,0.08),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(121,149,90,0.06),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        "Space Grotesk",
        system-ui,
        sans-serif;

    overflow-x: hidden;
}




/* =========================
   MAIN LAYOUT
========================= */

.dashboard {

    width: min(1100px, calc(100vw - 100px));

    margin: 0 auto;

    min-height: 100vh;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    grid-template-rows:
        auto
        auto;

    column-gap: 70px;

    row-gap: 48px;

    align-content: center;

    padding: 70px 0;

    animation:
        pageIn 0.7s
        0.75s
        ease both;
}


/* =========================
   TOP IMAGE
========================= */

.hero-image {

    width: 100%;

    height: 300px;

    overflow: hidden;

    position: relative;

    border-radius: 18px;

    border: 1px solid rgba(231,168,63,0.28);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.45),
        0 0 40px rgba(231,168,63,0.07);

    animation:
      imageCapture 0.42s
      0.05s
      cubic-bezier(.7,0,.2,1)
      both;
}


.hero-image img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    object-position: center;

    transform: scale(1.02);

    filter:
        saturate(0.95)
        contrast(1.04);

    transition:
        transform 0.5s ease,
        filter 0.5s ease;
}


.hero-image:hover img {

    transform: scale(1.055);

    filter:
        saturate(1.08)
        contrast(1.05);
}

.hero-image::before {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 5;

    background: white;

    opacity: 0;

    pointer-events: none;

    animation:
        cameraFlash 0.42s
        0.05s
        ease-out
        both;
}

/* cinematic light */

.hero-image::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            110deg,
            rgba(255,196,91,0.12),
            transparent 35%,
            rgba(121,149,90,0.08)
        );
}


/* =========================
   IMAGE CAPTURE EFFECT
========================= */

@keyframes imageCapture {

    /* image is already there */
    0% {
        clip-path: inset(0);
        transform: scale(1.03);
    }

    /* SNAP shut */
    28% {
        clip-path: inset(49% 0 49% 0);
        transform: scale(1.07);
    }

    /* tiny freeze */
    42% {
        clip-path: inset(49% 0 49% 0);
        transform: scale(1.07);
    }

    /* SNAP open */
    72% {
        clip-path: inset(0);
        transform: scale(1.025);
    }

    100% {
        clip-path: inset(0);
        transform: scale(1.02);
    }
}
@keyframes cameraFlash {

    0% {
        opacity: 0;
    }

    35% {
        opacity: 0;
    }

    /* BOOM */
    43% {
        opacity: 1;
    }

    47% {
        opacity: 0.75;
    }

    52% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}

/* =========================
   TITLE
========================= */

.hero-content {

    display: flex;

    flex-direction: column;

    justify-content: center;

    min-height: 300px;

    animation:
        titleIn 0.55s
        0.18s
        cubic-bezier(.22,1.2,.36,1)
        both;
}


.title {

    margin: 0;

    font-family:
        "Righteous",
        sans-serif;

    font-size: clamp(42px, 5vw, 58px);

    font-weight: 400;

    letter-spacing: 0.5px;

    color: var(--gold-light);

    text-shadow:
        0 0 24px rgba(231,168,63,0.12);
}


.subtitle {

    margin-top: 10px;

    color: var(--muted);

    font-size: 13px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


@keyframes titleIn {

    0% {
        opacity: 0;
        transform:
            translateY(-35px)
            rotate(1deg);
    }

    65% {
        opacity: 1;
        transform:
            translateY(5px)
            rotate(-0.2deg);
    }

    82% {
        transform:
            translateY(-1px)
            rotate(0.05deg);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            rotate(0);
    }
}


/* =========================
   LINKS AREA
========================= */

.links {

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    column-gap: 70px;

    grid-column: 1 / -1;

    border-top: 1px solid var(--line);

    padding-top: 34px;

    animation:
        linksIn 0.8s
        1.05s
        cubic-bezier(.16,1,.3,1)
        both;
}


@keyframes linksIn {

    from {

        opacity: 0;

        transform:
            translateY(25px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================
   GROUPS
========================= */

.group {

    margin-bottom: 30px;
}


.group-title {

    margin-bottom: 13px;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 1.8px;

    text-transform: uppercase;

    color: var(--gold);

}


.group-title::before {

    content: "✦ ";

    color: var(--orange);
}


/* =========================
   LINKS
========================= */

.group a {

    position: relative;

    display: block;

    width: fit-content;

    margin: 7px 0;

    color: #d6cfbc;

    text-decoration: none;

    font-size: 16px;

    font-weight: 500;

    letter-spacing: 0.15px;

    transition:
        color 0.15s ease,
        transform 0.15s ease;
}


.group a::after {

    content: "";

    position: absolute;

    left: 0;

    right: 100%;

    bottom: -3px;

    height: 1px;

    background: var(--gold);

    transition:
        right 0.2s ease;
}


.group a:hover {

    color: var(--gold-light);

    transform:
        translateX(5px);
}


.group a:hover::after {

    right: 0;
}


/* keyboard focus */

.group a:focus,
.group a:focus-visible {

    outline: none;

    color: var(--gold-light);

    transform:
        translateX(5px);
}


.group a:focus::after,
.group a:focus-visible::after {

    right: 0;

    box-shadow:
        0 0 7px rgba(231,168,63,0.45);
}


/* =========================
   FOOTER
========================= */

.footer {

    grid-column: 1 / -1;

    padding-top: 10px;

    border-top: 1px solid var(--line);

    display: flex;

    justify-content: space-between;

    color: #595446;

    font-size: 12px;
}


.footer a {

    color: #595446;

    text-decoration: none;

    transition:
        color 0.15s ease;
}


.footer a:hover {

    color: var(--gold);
}


/* =========================
   PAGE ENTRANCE
========================= */

@keyframes pageIn {

    from {

        opacity: 0;
    }

    to {

        opacity: 1;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 850px) {

    .dashboard {

        width: min(
            calc(100vw - 40px),
            650px
        );

        grid-template-columns: 1fr;

        row-gap: 30px;

        padding: 40px 0;
    }


    .hero-image {

        height: 280px;
    }


    .hero-content {

        min-height: auto;
    }


    .links {

        grid-template-columns: 1fr;

        column-gap: 0;

        row-gap: 10px;
    }


    .footer {

        grid-column: 1;
    }
}


@media (max-width: 500px) {

    .dashboard {

        width: calc(100vw - 30px);

        padding: 25px 0;
    }


    .hero-image {

        height: 230px;

        border-radius: 14px;
    }


    .title {

        font-size: 42px;
    }


    .group a {

        font-size: 15px;
    }
}


/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;
    }

}

</style>
</head>


<body>


<!-- CAMERA SHUTTER -->
<div class="shutter"></div>


<main class="dashboard">


    <!-- =====================
         TOP LEFT
    ====================== -->

    <div class="hero-image">

        <img
            src="media/Evaglion.jpg"
            alt=""
        >

    </div>


    <!-- =====================
         TOP RIGHT
    ====================== -->

    <section class="hero-content">

        <h1 class="title">
            ~/entertainment
        </h1>

        <div class="subtitle">
            cinema · anime · stories · culture
        </div>

    </section>


    <!-- =====================
         BOTTOM
    ====================== -->

    <section class="links">


        <!-- COLUMN 1 -->

        <div>


            <div class="group">

                <div class="group-title">
                    anime
                </div>

                <a href="https://www.crunchyroll.com/">
                    Crunchyroll
                </a>

                <a href="https://anilist.co/">
                    AniList
                </a>

                <a href="https://myanimelist.net/">
                    MyAnimeList
                </a>

                <a href="https://www.animenewsnetwork.com/">
                    AnimeNews
                </a>

            </div>


            <div class="group">

                <div class="group-title">
                    cinema
                </div>

                <a href="https://letterboxd.com/">
                    Letterboxd
                </a>

                <a href="https://getrefract.app/">
                    Refract
                </a>

                <a href="https://www.imdb.com/">
                    IMDb
                </a>

                <a href="https://www.rottentomatoes.com/">
                    Rotten Tomatoes
                </a>

            </div>


        </div>


        <!-- COLUMN 2 -->

        <div>


            <div class="group">

                <div class="group-title">
                    books
                </div>

                <a href="https://www.goodreads.com/">
                    Goodreads
                </a>

                <a href="https://app.thestorygraph.com/">
                    StoryGraph
                </a>

                <a href="https://standardebooks.org/">
                    Standard Ebooks
                </a>

            </div>


            <div class="group">

                <div class="group-title">
                    web
                </div>

                <a href="https://www.webnovel.com/">
                    Webnovel
                </a>

                <a href="https://www.webtoons.com/">
                    WEBTOON
                </a>

                <a href="https://www.manta.net/">
                    Manta
                </a>

            </div>


        </div>


    </section>


    <!-- =====================
         FOOTER
    ====================== -->

    <footer class="footer">

        <span>
            [ h j k l ] navigate
            &nbsp;&nbsp;
            [ enter ] open
        </span>

        <a href="collections.html">
            ~/home
        </a>

    </footer>


</main>


<script>

/* =========================
   KEYBOARD NAVIGATION
========================= */

const links = [
    ...document.querySelectorAll(".group a")
];

let current = 0;


/* -------------------------
   spatial navigation
------------------------- */

function move(direction) {

    if (!links.length)
        return;


    const currentRect =
        links[current].getBoundingClientRect();


    let best = -1;

    let bestDistance = Infinity;


    links.forEach((link, index) => {

        if (index === current)
            return;


        const rect =
            link.getBoundingClientRect();


        const dx =
            rect.left -
            currentRect.left;


        const dy =
            rect.top -
            currentRect.top;


        let valid = false;


        if (direction === "left") {

            valid =
                dx < -5;

        }

        if (direction === "right") {

            valid =
                dx > 5;

        }

        if (direction === "up") {

            valid =
                dy < -5;

        }

        if (direction === "down") {

            valid =
                dy > 5;

        }


        if (!valid)
            return;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (distance < bestDistance) {

            bestDistance = distance;

            best = index;

        }

    });


    if (best !== -1) {

        current = best;

        links[current].focus();

    }

}


/* -------------------------
   keyboard
------------------------- */

document.addEventListener(
    "keydown",
    event => {

        switch (event.key) {


            case "h":
            case "ArrowLeft":

                event.preventDefault();

                move("left");

                break;


            case "l":
            case "ArrowRight":

                event.preventDefault();

                move("right");

                break;


            case "k":
            case "ArrowUp":

                event.preventDefault();

                move("up");

                break;


            case "j":
            case "ArrowDown":

                event.preventDefault();

                move("down");

                break;


            case "Enter":

                event.preventDefault();

                if (links[current]) {

                    links[current].click();

                }

                break;


            case "m":
            case "Escape":

                event.preventDefault();

                window.location.href =
                    "collections.html";

                break;

        }

    }
);


/* mouse -> keyboard sync */

links.forEach(
    (link, index) => {

        link.addEventListener(
            "mouseenter",
            () => {

                current = index;

            }
        );

    }
);


/* first link */

window.addEventListener(
    "load",
    () => {

        if (links.length) {

            current = 0;

            links[0].focus();

        }

    }
);

</script>


</body>
</html>
