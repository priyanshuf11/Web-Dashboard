<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>~/home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap"
    rel="stylesheet"
>

<style>

:root {

    --bg: #0c1015;

    --surface: #11171d;

    --text: #dedbd5;

    --soft: #c7c1bc;

    --muted: #7d858d;

    --accent: #c79b9d;

    --accent-soft: #aebcc4;

    --link: #9ba5ad;

    --hover: #eee8e2;

    --line: #252d33;

    --warm-glow:
        rgba(199, 155, 157, 0.07);
}


* {
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {

    min-height: 100vh;
    padding: 40px;
    position: relative;
    overflow: hidden;
    color: var(--text);
    font-family:
        "Nunito",
        sans-serif;
    background:
        radial-gradient(
            circle at 20% 45%,
            rgba(174,188,196,0.045),
            transparent 32%
        ),
        radial-gradient(
            circle at 78% 35%,
            var(--warm-glow),
            transparent 30%
        ),
        var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
}

body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    left: -250px;
    bottom: -300px;
    border-radius: 50%;
    background:
        rgba(174,188,196,0.025);
    filter:
        blur(80px);
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,0.28) 100%
        );
    z-index: 20;
}


.dashboard {
    width:
        min(1120px, 100%);
    display: grid;
    grid-template-columns:
        310px
        minmax(0, 1fr);
    column-gap: 78px;
    align-items: center;
    position: relative;
    z-index: 2;
}


.portrait {
    width: 310px;
    height: 465px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    border-radius:
        5px
        5px
        28px
        5px;
    background:
        #111;
    box-shadow:
        0 25px 65px
        rgba(0,0,0,0.48),
        0 0 45px
        rgba(199,155,157,0.045);
    animation:
        portraitIn
        1s
        cubic-bezier(.16,1,.3,1)
        both;
}

.portrait::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    border:
        1px solid
        rgba(199,155,157,0.20);
    border-radius:
        inherit;
    pointer-events: none;
}

.portrait::after {
    content: "";
    position: absolute;
    top: -20%;
    left: -60%;
    width: 45%;
    height: 140%;
    z-index: 4;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,230,220,0.08),
            transparent
        );
    transform:
        rotate(8deg);
    animation:
        lightPass
        2.2s
        0.8s
        ease-out
        both;
    pointer-events: none;
}

.portrait img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter:
        saturate(0.72)
        brightness(0.90)
        contrast(0.96);
    transform:
        scale(1.015);
    animation:
        imageSettle
        1.3s
        ease-out
        both;
    transition:
        transform 0.8s ease,
        filter 0.8s ease;
}

.portrait:hover img {
    transform:
        scale(1.035);
    filter:
        saturate(0.82)
        brightness(0.94)
        contrast(0.98);
}


@keyframes portraitIn {
    from {
        opacity: 0;
        transform:
            translateX(-24px)
            rotate(-0.8deg);
    }
    to {
        opacity: 1;
        transform:
            translateX(0)
            rotate(0);
    }
}

@keyframes imageSettle {
    from {
        transform:
            scale(1.07);
        filter:
            saturate(0.45)
            brightness(0.75);
    }
    to {
        transform:
            scale(1.015);
        filter:
            saturate(0.72)
            brightness(0.90);
    }
}

@keyframes lightPass {
    from {
        left: -60%;
        opacity: 0;
    }
    25% {
        opacity: 1;
    }
    to {
        left: 130%;
        opacity: 0;
    }
}

.content {
    min-width: 0;
    animation:
        contentIn
        0.85s
        0.12s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes contentIn {
    from {
        opacity: 0;
        transform:
            translateX(22px);
    }
    to {
        opacity: 1;
        transform:
            translateX(0);
    }
}

.greeting {
    margin:
        0 0 5px;
    color:
        var(--text);
    font-family:
        "Caveat",
        cursive;
    font-size: 52px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: 0.2px;
    animation:
        greetingIn
        0.8s
        0.25s
        cubic-bezier(.2,1.2,.3,1)
        both;
}

@keyframes greetingIn {
    from {
        opacity: 0;
        transform:
            translateY(-15px)
            rotate(-1deg);
    }
    70% {
        transform:
            translateY(2px)
            rotate(0.15deg);
    }
    to {
        opacity: 1;
        transform:
            translateY(0)
            rotate(0);
    }
}

.date {
    margin-bottom: 34px;
    color:
        var(--muted);
    font-family:
        "DM Mono",
        monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
}



.groups {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(130px, 1fr));
    column-gap: 72px;
    row-gap: 32px;
}

.group {
    position: relative;
}



.group-title {
    margin-bottom: 11px;
    color:
        var(--accent);
    font-family:
        "DM Mono",
        monospace;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.3px;
    white-space: nowrap;
    transition:
        color 0.25s ease;
}

.group:hover .group-title {
    color:
        #d8b5b6;
}


.links {
    display: flex;
    flex-direction: column;
    gap: 6px;
}


.links a {
    width: fit-content;
    position: relative;
    color:
        var(--link);
    text-decoration: none;
    font-family:
        "Nunito",
        sans-serif;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.45;
    transition:
        color 0.2s ease,
        transform 0.2s ease;
}



.links a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 0;
    height: 1px;
    background:
        var(--accent);
    opacity: 0.7;
    transition:
        width 0.25s ease;
}


.links a:hover {
    color:
        var(--hover);
    transform:
        translateX(3px);
}


.links a:hover::after {
    width: 100%;
}


/* =========================================================
   KEYBOARD FOCUS
========================================================= */

.links a:focus,
.links a:focus-visible {

    outline: none;

    color:
        var(--hover);

    transform:
        translateX(3px);
}


.links a:focus::after,
.links a:focus-visible::after {

    width: 100%;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    display: block;

    margin-top: 38px;

    padding-top: 10px;

    border-top:
        1px solid
        var(--line);

    font-family:
        "DM Mono",
        monospace;

    font-size: 10px;

    letter-spacing: 0.4px;

    animation:
        footerIn
        0.6s
        0.5s
        ease-out
        both;
}


.footer a,
.footer a:visited {

    color:
        #4e585f;

    text-decoration: none;

    cursor: pointer;

    transition:
        color 0.2s ease;
}


.footer a:hover {

    color:
        var(--accent);

    text-decoration: none;
}


@keyframes footerIn {

    from {

        opacity: 0;
    }

    to {

        opacity: 1;
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    body {

        padding: 28px;
    }


    .dashboard {

        column-gap: 45px;

        grid-template-columns:
            260px
            minmax(0, 1fr);
    }


    .portrait {

        width: 260px;

        height: 390px;
    }


    .groups {

        column-gap: 40px;
    }

}


@media (max-width: 760px) {

    body {

        overflow-y: auto;

        padding:
            30px 22px;
    }


    .dashboard {

        grid-template-columns: 1fr;

        row-gap: 35px;

        width:
            min(500px, 100%);
    }


    .portrait {

        width: 220px;

        height: 330px;

        justify-self: center;
    }


    .content {

        width: 100%;
    }


    .greeting {

        font-size: 46px;
    }


    .groups {

        column-gap: 30px;
    }

}


@media (max-width: 430px) {

    .groups {

        grid-template-columns: 1fr;

        row-gap: 24px;
    }


    .greeting {

        font-size: 42px;
    }


    .date {

        margin-bottom: 28px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            0.01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            0.01ms !important;
    }

}

</style>

</head>


<body>

<script>

/* =========================================================
   DATE
========================================================= */

function updateDate() {

    const now =
        new Date();


    const day =
        now.toLocaleDateString(
            undefined,
            {
                weekday: "long"
            }
        );


    const date =
        now.toLocaleDateString(
            undefined,
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );


    const time =
        now.toLocaleTimeString(
            undefined,
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        );


    document
        .getElementById("date")
        .textContent =
        `${day} ${time} | ${date}`;
}


updateDate();

setInterval(
    updateDate,
    1000
);


/* =========================================================
   KEYBOARD NAVIGATION
========================================================= */

const links =
    [...document.querySelectorAll(".links a")];


let current = 0;


/* Focus first link */

window.addEventListener(
    "load",
    () => {

        if (links.length) {

            links[0].focus();

        }

    }
);


/* =========================================================
   MOVE
========================================================= */

function move(direction) {

    const currentLink =
        document.activeElement;


    if (!links.includes(currentLink)) {

        links[0].focus();

        return;
    }


    const currentRect =
        currentLink.getBoundingClientRect();


    const currentX =
        currentRect.left +
        currentRect.width / 2;


    const currentY =
        currentRect.top +
        currentRect.height / 2;


    let bestLink = null;

    let bestScore = Infinity;


    links.forEach(link => {

        if (link === currentLink)
            return;


        const rect =
            link.getBoundingClientRect();


        const x =
            rect.left +
            rect.width / 2;


        const y =
            rect.top +
            rect.height / 2;


        const dx =
            x - currentX;


        const dy =
            y - currentY;


        if (
            direction === "left" &&
            dx >= -5
        )
            return;


        if (
            direction === "right" &&
            dx <= 5
        )
            return;


        if (
            direction === "up" &&
            dy >= -5
        )
            return;


        if (
            direction === "down" &&
            dy <= 5
        )
            return;


        let score;


        if (
            direction === "left" ||
            direction === "right"
        ) {

            score =
                Math.abs(dx) +
                Math.abs(dy) * 2;

        } else {

            score =
                Math.abs(dy) +
                Math.abs(dx) * 2;

        }


        if (
            score < bestScore
        ) {

            bestScore =
                score;

            bestLink =
                link;

        }

    });


    if (bestLink) {

        bestLink.focus();

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        switch (event.key) {


            case "ArrowLeft":
            case "h":

                event.preventDefault();

                move("left");

                break;


            case "ArrowRight":
            case "l":

                event.preventDefault();

                move("right");

                break;


            case "ArrowUp":
            case "k":

                event.preventDefault();

                move("up");

                break;


            case "ArrowDown":
            case "j":

                event.preventDefault();

                move("down");

                break;


            case "Enter":

                if (
                    links.includes(
                        document.activeElement
                    )
                ) {

                    event.preventDefault();

                    document
                        .activeElement
                        .click();

                }

                break;


            case "m":
            case "Escape":

                window.location.href =
                    "collections.html";

                break;

        }

    }
);

</script>
