<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>~/home</title>

<style>
:root {
    --bg: #03070d;
    --text: #c8d9e8;
    --muted: #71869a;
    --accent: #9bbbd4;
    --link: #657b8e;
    --hover: #dcecf8;
    --line: #17222d;
}

    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--bg);
    }

    body {
        min-height: 100vh;
        padding: 40px;
        position: relative;
        overflow: hidden;
        color: var(--text);
        font-family: "Cascadia Mono", "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", "Courier New", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /*
       IMPORTANT:
       The image is NOT a background.
       It is a normal element with a fixed box, so the text
       can never sit on top of it.
    */
    .dashboard {
        width: min(1120px, 100%);
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr);
        column-gap: 88px;
        align-items: center;
    }

    .portrait {
        width: 310px;
        height: 465px;
        overflow: hidden;
        background: #0b0b0b;
        flex-shrink: 0;

        animation: imageFrame 0.9s ease-out both;
    }

    .portrait img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
    }

    .content {
        min-width: 0;
    }

    .greeting {
        margin: 0 0 10px;
        color: #d7e7f4;
        font-size: 42px;
        line-height: 1.1;
        font-weight: 600;
        letter-spacing: -1px;
    }

    .date {
        margin-bottom: 40px;
        color: var(--muted);
        font-size: 13px;
    }

    .groups {
        display: grid;
        grid-template-columns: repeat(2, minmax(130px, 1fr));
        column-gap: 76px;
        row-gap: 40px;
    }

    .group-title {
        margin-bottom: 12px;
        color: var(--accent);
        font-size: 19px;
        font-weight: 600;
        white-space: nowrap;
    }

    .links {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .links a {
        width: fit-content;
        color:var(--link);
        text-decoration: none;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.4;
        transition: color 0.15s ease, transform 0.15s ease;
    }

    .links a:hover {
        color: var(--hover);
        transform: translateX(4px);
    }

    .links a:focus,
    .links a:focus-visible {
        outline: none;
        box-shadow: none;
    }
    .links a:focus {
    outline: none;
    color: var(--hover);
    transform: translateX(4px);
    }

.footer {
    display: block;
    margin-top: 44px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 12px;
}

.footer a,
.footer a:visited {
    color: #344553;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s ease;
}

.footer a:hover {
    color: var(--accent);
    text-decoration: none;
}

    /* Smaller browser windows */
    @media (max-width: 760px) {
        body {
            padding: 28px 22px;
        }

        .dashboard {
            grid-template-columns: 1fr;
            row-gap: 40px;
            width: min(500px, 100%);
        }

        .portrait {
            width: 220px;
            height: 330px;
            justify-self: center;
        }

        .groups {
            column-gap: 30px;
        }
    }

    @media (max-width: 430px) {
        .groups {
            grid-template-columns: 1fr;
        }

        .greeting {
            font-size: 32px;
        }
    }
</style>
</head>

<body>

<div class="dashboard">

    <div class="portrait">
        <img src="Reze.jpg" alt="">
    </div>

    <div class="content">

        <h1 class="greeting">Welcome back!</h1>
        <div class="date" id="date"></div>

        <div class="groups">

            <div class="group">
                <div class="group-title">~/general</div>
                <div class="links">
                    <a href="https://mail.google.com" target="_blank">Gmail</a>
                    <a href="https://www.youtube.com" target="_blank">YouTube</a>
                    <a href="https://www.reddit.com" target="_blank">Reddit</a>
                    <a href="https://www.google.com" target="_blank">Google</a>
                </div>
            </div>

            <div class="group">
                <div class="group-title">~/dev</div>
                <div class="links">
                    <a href="https://github.com" target="_blank">GitHub</a>
                    <a href="https://leetcode.com" target="_blank">LeetCode</a>
                    <a href="https://stackoverflow.com" target="_blank">Stack Overflow</a>
                </div>
            </div>

            <div class="group">
                <div class="group-title">~/ai</div>
                <div class="links">
                    <a href="https://chatgpt.com" target="_blank">ChatGPT</a>
                    <a href="https://claude.ai" target="_blank">Claude</a>
                    <a href="https://gemini.google.com" target="_blank">Gemini</a>
                    <a href="https://www.perplexity.ai" target="_blank">Perplexity</a>
                </div>
            </div>

            <div class="group">
                <div class="group-title">~/other</div>
                <div class="links">
                    <a href="https://www.wikipedia.org" target="_blank">Wikipedia</a>
                    <a href="https://maps.google.com" target="_blank">Maps</a>
                    <a href="https://drive.google.com" target="_blank">Drive</a>
                </div>
            </div>

        </div>

        <div class="footer">
          <a href="collections.html">~/home</a>
        </div>

    </div>
</div>

<script>
function updateDate() {
    const now = new Date();

    const day = now.toLocaleDateString(undefined, {
        weekday: "long"
    });

    const date = now.toLocaleDateString(undefined, {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });

    const time = now.toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    });

    document.getElementById("date").textContent =
        `${day} ${time} | ${date}`;
}

updateDate();
setInterval(updateDate, 1000);


/* -------------------------
   KEYBOARD NAVIGATION
------------------------- */

const links = [...document.querySelectorAll(".links a")];

let current = 0;


/* Focus first link when page loads */
window.addEventListener("load", () => {
    links[0].focus();
});


function move(direction) {

    const currentLink = document.activeElement;

    if (!links.includes(currentLink)) {
        links[0].focus();
        return;
    }

    const currentRect = currentLink.getBoundingClientRect();

    const currentX = currentRect.left + currentRect.width / 2;
    const currentY = currentRect.top + currentRect.height / 2;

    let bestLink = null;
    let bestScore = Infinity;

    links.forEach(link => {

        if (link === currentLink) return;

        const rect = link.getBoundingClientRect();

        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;

        const dx = x - currentX;
        const dy = y - currentY;

        /*
         * Only consider links in the
         * requested direction.
         */

        if (direction === "left" && dx >= -5) return;
        if (direction === "right" && dx <= 5) return;
        if (direction === "up" && dy >= -5) return;
        if (direction === "down" && dy <= 5) return;


        /*
         * Distance score.
         *
         * Favor links that are actually
         * in the direction we're travelling.
         */

        let score;

        if (direction === "left" || direction === "right") {
            score = Math.abs(dx) + Math.abs(dy) * 2;
        } else {
            score = Math.abs(dy) + Math.abs(dx) * 2;
        }

        if (score < bestScore) {
            bestScore = score;
            bestLink = link;
        }
    });

    if (bestLink) {
        bestLink.focus();
    }
}


document.addEventListener("keydown", event => {

    switch (event.key) {

        case "ArrowLeft":
        case "h":
            event.preventDefault();
            move("left");
            break;

        case "ArrowRight":
        case "l":
            event.preventDefault();
            move("right");
            break;

        case "ArrowUp":
        case "k":
            event.preventDefault();
            move("up");
            break;

        case "ArrowDown":
        case "j":
            event.preventDefault();
            move("down");
            break;

        case "Enter":
            if (links.includes(document.activeElement)) {
                event.preventDefault();
                document.activeElement.click();
            }
            break;
        case "m":
            window.location.href = "collections.html";
            break;

        case "Escape":
            window.location.href = "collections.html";
            break;
    }
});
</script>

</body>
</html>
