<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>~/collections</title>


<style>

/* =========================================================
   COLLECTIONS
   the entrance to every world
========================================================= */

:root {

    --bg: #080a0e;

    --text: #e4e0dc;
    --muted: #777b82;

    --line: rgba(255,255,255,0.08);

    --accent: #c9b2a5;

    --gap: 14px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

}


body {

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #11151b 0%,
            #090b0f 45%,
            #06080b 100%
        );

    color:
        var(--text);

    font-family:
        "Cascadia Mono",
        "JetBrains Mono",
        monospace;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;
}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

body::before {

    content: "";

    position: fixed;

    width: 55vw;
    height: 55vw;

    max-width: 700px;
    max-height: 700px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(190,165,150,0.055),
            transparent 68%
        );

    filter:
        blur(40px);

    pointer-events: none;

    transition:
        background 0.8s ease,
        transform 0.8s ease;
}


/* =========================================================
   TOP / BOTTOM FADE
========================================================= */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0.20),
            transparent 15%,
            transparent 85%,
            rgba(0,0,0,0.20)
        );

    z-index: 20;
}


/* =========================================================
   COLLECTION STRIP
========================================================= */

.collections {

    width:
        min(1420px, calc(100vw - 70px));

    height:
        min(650px, calc(100vh - 120px));

    display: flex;

    align-items: center;

    justify-content: center;

    gap: var(--gap);

    position: relative;

    z-index: 2;

    animation:
        enter
        0.7s
        cubic-bezier(.16,1,.3,1)
        both;
}


@keyframes enter {

    from {

        opacity: 0;

        transform:
            translateY(18px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   CARD
========================================================= */

.collection {

    position: relative;

    height:
        min(560px, 72vh);

    /*
       Six cards fit naturally.
    */

    flex:
        1 1 0;

    min-width: 0;

    overflow: hidden;

    cursor: pointer;

    text-decoration: none;

    background:
        #101318;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius:
        8px 8px 22px 8px;

    transform:
        scale(0.94);

    filter:
        brightness(0.62)
        saturate(0.65);

    opacity:
        0.72;

    transition:

        transform
        0.45s
        cubic-bezier(.16,1,.3,1),

        filter
        0.45s ease,

        opacity
        0.45s ease,

        border-color
        0.45s ease,

        box-shadow
        0.45s ease;

    /*
       Slightly different silhouettes.
    */

    z-index: 1;
}


/* =========================================================
   CARD SHAPES
========================================================= */

.collection:nth-child(1) {

    border-radius:
        10px 10px 28px 10px;
}


.collection:nth-child(2) {

    border-radius:
        18px 8px 8px 8px;
}


.collection:nth-child(3) {

    border-radius:
        8px 20px 8px 8px;
}


.collection:nth-child(4) {

    border-radius:
        8px 8px 24px 8px;
}


.collection:nth-child(5) {

    border-radius:
        20px 8px 8px 8px;
}


.collection:nth-child(6) {

    border-radius:
        8px 8px 28px 8px;
}


/* =========================================================
   IMAGE
========================================================= */

.collection img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    filter:
        brightness(0.75)
        saturate(0.7)
        contrast(1.02);

    transform:
        scale(1.025);

    transition:

        transform
        0.8s
        cubic-bezier(.16,1,.3,1),

        filter
        0.5s ease;
}


/* =========================================================
   IMAGE VIGNETTE
========================================================= */

.collection::before {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:

        linear-gradient(
            180deg,
            rgba(0,0,0,0.05),
            transparent 40%,
            rgba(0,0,0,0.72) 100%
        );
}


/* =========================================================
   SOFT CARD FRAME
========================================================= */

.collection::after {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    border:
        1px solid
        transparent;

    border-radius:
        inherit;

    transition:
        border-color 0.4s ease,
        box-shadow 0.4s ease;
}


/* =========================================================
   FOCUSED CARD
========================================================= */

.collection.focused {

    transform:
        scale(1);

    filter:
        brightness(1)
        saturate(0.9);

    opacity:
        1;

    z-index: 10;

    border-color:
        rgba(255,255,255,0.16);

    box-shadow:

        0 30px 70px
        rgba(0,0,0,0.45),

        0 0 35px
        rgba(201,178,165,0.055);
}


.collection.focused img {

    transform:
        scale(1.045);

    filter:
        brightness(0.94)
        saturate(0.88)
        contrast(1.03);
}


.collection.focused::after {

    border-color:
        rgba(220,205,196,0.22);

    box-shadow:
        inset 0 0 35px
        rgba(255,255,255,0.025);
}


/* =========================================================
   NEIGHBOURING CARDS
========================================================= */

.collection.focused + .collection {

    transform:
        scale(0.96);

    opacity:
        0.82;
}


/* =========================================================
   CARD NAME
========================================================= */

.collection-name {

    position: absolute;

    left: 18px;
    right: 18px;

    bottom: 20px;

    z-index: 6;

    color:
        rgba(255,255,255,0.62);

    font-size:
        13px;

    font-weight:
        500;

    letter-spacing:
        0.2px;

    transition:
        color 0.35s ease,
        transform 0.35s ease;
}





.collection.focused .collection-name {

    color:
        #f1ece7;

    transform:
        translateX(2px);
}





/* =========================================================
   HOVER
========================================================= */

.collection:hover {

    opacity:
        0.92;

    filter:
        brightness(0.86)
        saturate(0.78);
}


.collection:hover img {

    transform:
        scale(1.04);
}


/* =========================================================
   FOCUS
========================================================= */

.collection:focus,
.collection:focus-visible {

    outline:
        none;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    position: fixed;

    bottom: 24px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 30;

    color:
        #454b52;

    font-size:
        10px;

    letter-spacing:
        1px;

    user-select:
        none;

    opacity:
        0;

    animation:
        footerIn
        0.6s
        0.5s
        ease-out
        forwards;
}


@keyframes footerIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1100px) {

    .collections {

        width:
            calc(100vw - 40px);

        gap:
            9px;
    }


    .collection {

        height:
            min(500px, 70vh);
    }


    .collection-name {

        left: 12px;
        right: 12px;

        bottom: 15px;

        font-size: 11px;
    }

}


@media (max-width: 750px) {

    body {

        overflow-y: auto;
    }


    .collections {

        width:
            calc(100vw - 30px);

        height:
            auto;

        min-height:
            100vh;

        padding:
            35px 0 70px;

        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap:
            12px;
    }


    .collection {

        width:
            100%;

        height:
            260px;

        transform:
            scale(0.98);

        opacity:
            0.82;
    }


    .collection.focused {

        transform:
            scale(1.015);
    }


    .footer {

        bottom:
            16px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            0.01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            0.01ms !important;
    }

}

</style>

</head>


<body>


<div class="collections">


    <!-- HOME -->

    <a
        class="collection"
        data-page="home.html"
        href="home.html"
    >

        <img
            src="Reze.jpg"
            alt=""
        >

        <div class="collection-name">
            ~/home
        </div>

    </a>


    <!-- WORK -->

    <a
        class="collection"
        data-page="work.html"
        href="work.html"
    >

        <img
            src="hirugama.jpg"
            alt=""
        >

        <div class="collection-name">
            ~/work
        </div>

    </a>


    <!-- AI -->

    <a
        class="collection"
        data-page="code.html"
        href="code.html"
    >

        <img
            src="lightYagami.jpg"
            alt=""
        >

        <div class="collection-name">
            ~/code
        </div>

    </a>


    <!-- SOCIAL -->

    <a
        class="collection"
        data-page="social.html"
        href="social.html"
    >

        <img
            src="gintoki.jpg"
            alt=""
        >

        <div class="collection-name">
            ~/social
        </div>

    </a>


    <!-- UNDERGROUND -->

    <a
        class="collection"
        data-page="underground.html"
        href="underground.html"
    >

        <img
            src="itadori.jpg"
            alt=""
        >

        <div class="collection-name">
            ~/underground
        </div>

    </a>


    <!-- ENTERTAINMENT -->

    <a
        class="collection"
        data-page="entertainment.html"
        href="entertainment.html"
    >

        <img
            src="evaglion.jpg"
            alt=""
        >

        <div class="collection-name">
            ~/entertainment
        </div>

    </a>


</div>


<div class="footer">

    ~/collections

</div>


<script>

/* =========================================================
   COLLECTIONS
========================================================= */

const collections =
    [...document.querySelectorAll(".collection")];


let current = 0;


/* =========================================================
   REMEMBER LAST DASHBOARD
========================================================= */

const lastDashboard =
    localStorage.getItem("lastDashboard");


/*
   Find the last dashboard we visited.
*/

if (lastDashboard) {

    const rememberedIndex =
        collections.findIndex(
            item =>
                item.dataset.page === lastDashboard
        );


    if (rememberedIndex !== -1) {

        current =
            rememberedIndex;

    }

}


/* =========================================================
   SET CURRENT
========================================================= */

function setCurrent(index) {

    current =
        (index + collections.length)
        % collections.length;


    collections.forEach(
        (item, i) => {

            item.classList.toggle(
                "focused",
                i === current
            );

        }
    );


    /*
       Slightly move the ambient light
       according to the selected card.
    */

    const position =
        ((current + 0.5) / collections.length)
        * 100;


    document.body.style.setProperty(
        "--light-position",
        `${position}%`
    );

}


/* =========================================================
   REMEMBER WHEN OPENING
========================================================= */

function openCurrent() {

    const item =
        collections[current];


    const page =
        item.dataset.page;


    /*
       Save the dashboard BEFORE leaving.
    */

    localStorage.setItem(
        "lastDashboard",
        page
    );


    window.location.href =
        page;
}


/* =========================================================
   KEYBOARD NAVIGATION
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        switch (event.key) {


            case "ArrowRight":
            case "l":

                event.preventDefault();

                setCurrent(
                    current + 1
                );

                break;


            case "ArrowLeft":
            case "h":

                event.preventDefault();

                setCurrent(
                    current - 1
                );

                break;


            case "Enter":

                event.preventDefault();

                openCurrent();

                break;


            case "Escape":
            case "m":

                event.preventDefault();

                /*
                   Home is also remembered.
                */

                localStorage.setItem(
                    "lastDashboard",
                    "home.html"
                );

                window.location.href =
                    "home.html";

                break;

        }

    }
);


/* =========================================================
   MOUSE
========================================================= */

collections.forEach(
    (item, index) => {

        item.addEventListener(
            "mouseenter",
            () => {

                setCurrent(index);

            }
        );


        /*
           Clicking a card should also
           remember it.
        */

        item.addEventListener(
            "click",
            () => {

                localStorage.setItem(
                    "lastDashboard",
                    item.dataset.page
                );

            }
        );

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

setCurrent(current);

</script>


</body>

</html>
