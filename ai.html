<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>~/ai</title>

<style>
    :root {
    --bg: #0d090a;
    --text: #e8ddd0;
    --muted: #a98282;
    --accent: #7d303b;
    --hover: #f1e7dc;
    --line: #32171c;
}

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--bg);
    }

    body {
        min-height: 100vh;
        padding: 50px;

        overflow: hidden;

        color: var(--text);

       font-family:
    "Times New Roman",
    Times,
    serif;

        display: flex;
        align-items: center;
        justify-content: center;
    }


    /* -------------------------
       MAIN CONTAINER
    ------------------------- */

    .dashboard {
        width: min(1100px, 100%);

        display: flex;
        flex-direction: column;

        align-items: stretch;
    }


    /* -------------------------
       HERO IMAGE
    ------------------------- */

    .hero {
        width: 100%;
        height: 310px;

        overflow: hidden;

        background: #140b0d;

        border-radius: 8px;

        border: 1px solid rgba(125, 48, 59, 0.35);

        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.35);

        animation:
            frameReveal 0.2s ease-out both;
    }


    .hero img {
        display: block;

        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: center;

        /*
           Starts completely hidden,
           then reveals from top to bottom.
        */
        clip-path: inset(0 0 100% 0);

        filter: brightness(0.72)
                saturate(0.92);

        animation:
            imageReveal 0.9s cubic-bezier(0.77, 0, 0.18, 1)
            0.05s forwards,
            imageLight 0.7s ease-out
            0.35s forwards;
    }


    /* -------------------------
       TITLE
    ------------------------- */

.title {
    font-family: "Cloister Black", "Old English MT", serif;
    font-size: 42px;
    font-weight: normal;
    color: #e8ddd0;
}


    /* -------------------------
       LINKS GRID
    ------------------------- */

.links {
    display: flex;

    justify-content: space-between;
    align-items: flex-start;

    margin-top: 4px;

    padding: 0 55px;
}


.link-column {
    display: flex;

    flex-direction: column;

    gap: 14px;

    width: 280px;
    align-items: center;
}


    .links a {
        width: fit-content;

        color: #9b6269;

        text-decoration: none;

        font-size: 21px;
        font-weight: 700;

        line-height: 1.5;

        opacity: 0;

        transform: translateY(6px);

        filter: blur(4px);

        transition:
            color 0.15s ease,
            transform 0.15s ease;

        animation:
            linkReveal 0.4s ease-out forwards;
    }


    .links a:hover {
        color: var(--hover);

        transform: translateX(4px);
    }


    .links a:focus,
    .links a:focus-visible {
        outline: none;
        box-shadow: none;
    }
    .links a:focus,
    .links a:focus-visible {
        outline: none;

        color: #e8ddd0;

        transform: translateX(5px);

        text-shadow:
        0 0 12px rgba(155, 98, 105, 0.45);
}


    /* -------------------------
       LINK ANIMATION DELAYS
    ------------------------- */

.link-column:first-child a:nth-child(1) {
    animation-delay: 0.78s;
}

.link-column:first-child a:nth-child(2) {
    animation-delay: 0.83s;
}

.link-column:first-child a:nth-child(3) {
    animation-delay: 0.88s;
}

.link-column:first-child a:nth-child(4) {
    animation-delay: 0.93s;
}

.link-column:first-child a:nth-child(5) {
    animation-delay: 0.98s;
}


.link-column:last-child a:nth-child(1) {
    animation-delay: 0.83s;
}

.link-column:last-child a:nth-child(2) {
    animation-delay: 0.88s;
}

.link-column:last-child a:nth-child(3) {
    animation-delay: 0.93s;
}

.link-column:last-child a:nth-child(4) {
    animation-delay: 0.98s;
}

.link-column:last-child a:nth-child(5) {
    animation-delay: 1.03s;
}


    /* -------------------------
       FOOTER
    ------------------------- */

    .footer {
        margin-top: 44px;
        padding-top: 10px;

        border-top: 1px solid var(--line);

        color: #344553;

        font-size: 12px;

        opacity: 0;

        transform: translateY(6px);

        filter: blur(4px);

        animation:
            textReveal 0.45s ease-out
            1.25s forwards;
    }


    .footer a,
    .footer a:visited {
        color: #344553;

        text-decoration: none;
    }


    .footer a:hover {
        color: var(--accent);
    }


    /* -------------------------
       ANIMATIONS
    ------------------------- */

    @keyframes imageReveal {

        from {
            clip-path: inset(0 0 100% 0);
        }

        to {
            clip-path: inset(0 0 0 0);
        }

    }


    @keyframes imageLight {

        from {
            filter: brightness(0.62);
        }

        to {
            filter: brightness(0.82);
        }

    }


    @keyframes frameReveal {

        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }

    }


    @keyframes textReveal {

        from {
            opacity: 0;

            transform:
                translateY(8px);

            filter: blur(6px);
        }

        to {
            opacity: 1;

            transform:
                translateY(0);

            filter: blur(0);
        }

    }


    @keyframes linkReveal {

        from {
            opacity: 0;

            transform:
                translateY(6px);

            filter: blur(4px);
        }

        to {
            opacity: 1;

            transform:
                translateY(0);

            filter: blur(0);
        }

    }


    /* -------------------------
       SMALL WINDOWS
    ------------------------- */

    @media (max-width: 800px) {

        body {
            padding: 30px 25px;
        }

        .hero {
            height: 240px;
        }

        .links {
            column-gap: 50px;
            padding: 0 30px;
        }

    }


    @media (max-width: 550px) {

        body {
            padding: 25px 20px;
        }

        .hero {
            height: 200px;
        }

        .title {
            font-size: 26px;
        }

        .links {
            grid-template-columns: 1fr;

            row-gap: 10px;
            padding: 0;
        }
        .link-column{
            gap: 10px;
        }

    }
</style>
</head>


<body>


<div class="dashboard">


    <!-- HERO -->

    <div class="hero">

        <img
            src="lightYagami.jpg"
            alt=""
        >

    </div>


    <!-- TITLE -->

    <h1 class="title">
        ~/AI
    </h1>


<!-- LINKS -->

    <div class="links">

        <div class="link-column">

            <a href="https://claude.ai" target="_blank">
                Claude
            </a>

            <a href="https://chatgpt.com" target="_blank">
                ChatGPT
            </a>

            <a href="https://gemini.google.com" target="_blank">
                Gemini
            </a>

            <a href="https://www.perplexity.ai" target="_blank">
                Perplexity
            </a>

            <a href="https://copilot.microsoft.com" target="_blank">
                Copilot
            </a>

        </div>


        <div class="link-column">

            <a href="https://chat.deepseek.com" target="_blank">
                DeepSeek
            </a>

            <a href="https://grok.com" target="_blank">
                Grok
            </a>

            <a href="https://midjourney.com" target="_blank">
                Midjourney
            </a>

            <a href="https://mistral.ai" target="_blank">
                Mistral
            </a>

            <a href="https://poe.com" target="_blank">
                Poe
            </a>

        </div>

    </div>
    <!-- FOOTER -->

    <div class="footer">
        <a href="collections.html">~/collections</a>
    </div>


</div>


<script>

/* -------------------------
   LINKS
------------------------- */

const links =
    [...document.querySelectorAll(".links a")];

let current = 0;


/* -------------------------
   SPATIAL NAVIGATION
------------------------- */

function move(direction) {

    const currentLink =
        document.activeElement;


    /*
       If nothing is selected,
       start at the first link.
    */

    if (!links.includes(currentLink)) {

        links[0].focus();

        return;
    }


    const currentRect =
        currentLink.getBoundingClientRect();


    const currentX =
        currentRect.left +
        currentRect.width / 2;


    const currentY =
        currentRect.top +
        currentRect.height / 2;


    let bestLink = null;

    let bestScore = Infinity;


    links.forEach(link => {

        if (link === currentLink)
            return;


        const rect =
            link.getBoundingClientRect();


        const x =
            rect.left +
            rect.width / 2;


        const y =
            rect.top +
            rect.height / 2;


        const dx = x - currentX;
        const dy = y - currentY;


        /* Direction filter */

        if (
            direction === "left" &&
            dx >= -5
        ) return;


        if (
            direction === "right" &&
            dx <= 5
        ) return;


        if (
            direction === "up" &&
            dy >= -5
        ) return;


        if (
            direction === "down" &&
            dy <= 5
        ) return;


        /* Distance scoring */

        let score;


        if (
            direction === "left" ||
            direction === "right"
        ) {

            score =
                Math.abs(dx) +
                Math.abs(dy) * 2;

        } else {

            score =
                Math.abs(dy) +
                Math.abs(dx) * 2;

        }


        if (score < bestScore) {

            bestScore = score;

            bestLink = link;

        }

    });


    if (bestLink) {

        bestLink.focus();

    }

}


/* -------------------------
   KEYBOARD
------------------------- */

document.addEventListener("keydown", event => {

    switch (event.key) {


        case "ArrowLeft":
        case "h":

            event.preventDefault();

            move("left");

            break;


        case "ArrowRight":
        case "l":

            event.preventDefault();

            move("right");

            break;


        case "ArrowUp":
        case "k":

            event.preventDefault();

            move("up");

            break;


        case "ArrowDown":
        case "j":

            event.preventDefault();

            move("down");

            break;


        case "Enter":

            if (
                links.includes(
                    document.activeElement
                )
            ) {

                event.preventDefault();

                document.activeElement.click();

            }

            break;


        case "Escape":
        case "m":

            event.preventDefault();

            window.location.href =
                "collections.html";

            break;

    }

});

</script>

</body>
</html>
