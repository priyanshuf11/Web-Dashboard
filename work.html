<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>~/work</title>

<style>

    :root {
        --bg: #0a0a0a;
        --text: #d4d4d4;
        --muted: #777;
        --accent: #a6a6a6;
        --hover: #f0f0f0;
        --line: #242424;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--bg);
    }

    body {
        min-height: 100vh;
        padding: 40px;
        position: relative;
        overflow: hidden;

        color: var(--text);

        font-family:
            "Cascadia Mono",
            "JetBrains Mono",
            "SFMono-Regular",
            Consolas,
            "Liberation Mono",
            "Courier New",
            monospace;

        display: flex;
        align-items: center;
        justify-content: center;
    }


    /* =========================
       MAIN LAYOUT
    ========================= */

    .dashboard {
        width: min(1120px, 100%);

        display: grid;
        grid-template-columns: 310px minmax(0, 1fr);

        column-gap: 88px;

        align-items: center;
    }


    /* =========================
       IMAGE
    ========================= */

    .portrait {
        width: 310px;
        height: 465px;

        overflow: hidden;

        background: #111;

        flex-shrink: 0;

        /*
         * The image enters from the RIGHT edge
         * and grows toward the LEFT.
         */
        clip-path: inset(0 0 0 100%);

        animation:
            imageEnter 0.9s cubic-bezier(.22,.61,.36,1) forwards;
    }

    .portrait img {
        display: block;

        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: center;

        /*
         * Kill the color.
         */
        filter: grayscale(1) contrast(0.92) brightness(0.88);

        /*
         * Slight physical imperfection.
         */
        transform: scale(1.015);
    }


    /* =========================
       CONTENT
    ========================= */

    .content {
        min-width: 0;

        /*
         * Text enters from the opposite direction.
         * Starts slightly to the LEFT.
         */
        opacity: 0;
        transform: translateX(-28px);

        animation:
            textEnter 0.9s cubic-bezier(.22,.61,.36,1) forwards;
    }


    /* =========================
       TITLE
    ========================= */

    .greeting {
        margin: 0 0 10px;

        color: #d8d8d8;

        font-size: 42px;
        line-height: 1.1;

        font-weight: 600;

        letter-spacing: -1px;
    }


    .date {
        margin-bottom: 40px;

        color: var(--muted);

        font-size: 13px;
    }


    /* =========================
       GROUPS
    ========================= */

    .groups {
        display: grid;

        grid-template-columns:
            repeat(2, minmax(130px, 1fr));

        column-gap: 76px;
        row-gap: 40px;
    }


    .group-title {
        margin-bottom: 12px;

        color: var(--accent);

        font-size: 19px;
        font-weight: 600;

        white-space: nowrap;
    }


    .links {
        display: flex;
        flex-direction: column;

        gap: 7px;
    }


    .links a {
        width: fit-content;

        color: #969696;

        text-decoration: none;

        font-size: 17px;
        font-weight: 500;

        line-height: 1.4;

        transition:
            color 0.15s ease,
            transform 0.15s ease;
    }


    .links a:hover {
        color: var(--hover);

        transform: translateX(4px);
    }


    .links a:focus,
    .links a:focus-visible {
        outline: none;
        box-shadow: none;
    }


    .links a:focus {
        color: var(--hover);

        transform: translateX(4px);
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
        display: block;

        margin-top: 44px;
        padding-top: 10px;

        border-top: 1px solid var(--line);

        font-size: 12px;
    }


    .footer a,
    .footer a:visited {
        color: #555;

        text-decoration: none;

        cursor: pointer;

        transition: color 0.15s ease;
    }


    .footer a:hover {
        color: var(--accent);

        text-decoration: none;
    }


    /* =========================
       ANIMATIONS
    ========================= */

    /*
     * Physical reveal:
     *
     * The right edge exists first.
     * The image progressively expands
     * toward the LEFT.
     */
    @keyframes imageEnter {

        from {
            clip-path: inset(0 0 0 100%);
        }

        to {
            clip-path: inset(0 0 0 0);
        }
    }


    /*
     * Text moves in the opposite direction.
     */
    @keyframes textEnter {

        from {
            opacity: 0;
            transform: translateX(-28px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }
    }


    /* =========================
       SMALLER WINDOWS
    ========================= */

    @media (max-width: 760px) {

        body {
            padding: 28px 22px;
        }

        .dashboard {
            grid-template-columns: 1fr;

            row-gap: 40px;

            width: min(500px, 100%);
        }

        .portrait {
            width: 220px;
            height: 330px;

            justify-self: center;
        }

        .groups {
            column-gap: 30px;
        }
    }


    @media (max-width: 430px) {

        .groups {
            grid-template-columns: 1fr;
        }

        .greeting {
            font-size: 32px;
        }
    }

</style>
</head>


<body>

<div class="dashboard">


    <!-- =========================
         IMAGE
    ========================== -->

    <div class="portrait">
        <img src="media/hirugama.jpg" alt="">
    </div>


    <!-- =========================
         CONTENT
    ========================== -->

    <div class="content">

        <h1 class="greeting">~/work</h1>

        <div class="date" id="date"></div>


        <div class="groups">


            <!-- PROFESSIONAL -->

            <div class="group">

                <div class="group-title">
                    ~/professional
                </div>

                <div class="links">

                    <a href="https://www.linkedin.com"
                       target="_blank">
                        LinkedIn
                    </a>

                    <a href="https://www.indeed.com"
                       target="_blank">
                        Indeed
                    </a>

                    <a href="https://www.glassdoor.com"
                       target="_blank">
                        Glassdoor
                    </a>

                </div>

            </div>


            <!-- DEVELOPMENT -->

            <div class="group">

                <div class="group-title">
                    ~/development
                </div>

                <div class="links">

                    <a href="https://github.com"
                       target="_blank">
                        GitHub
                    </a>

                    <a href="https://stackoverflow.com"
                       target="_blank">
                        Stack Overflow
                    </a>

                    <a href="https://leetcode.com"
                       target="_blank">
                        LeetCode
                    </a>

                </div>

            </div>


            <!-- LEARNING -->

            <div class="group">

                <div class="group-title">
                    ~/learning
                </div>

                <div class="links">

                    <a href="https://www.udemy.com"
                       target="_blank">
                        Udemy
                    </a>

                    <a href="https://www.coursera.org"
                       target="_blank">
                        Coursera
                    </a>

                    <a href="https://www.edx.org"
                       target="_blank">
                        edX
                    </a>

                </div>

            </div>


            <!-- PRODUCTIVITY -->

            <div class="group">

                <div class="group-title">
                    ~/productivity
                </div>

                <div class="links">

                    <a href="https://mail.google.com"
                       target="_blank">
                        Gmail
                    </a>

                    <a href="https://drive.google.com"
                       target="_blank">
                        Drive
                    </a>

                    <a href="https://docs.google.com"
                       target="_blank">
                        Docs
                    </a>

                    <a href="https://www.notion.so"
                       target="_blank">
                        Notion
                    </a>

                </div>

            </div>


        </div>


        <div class="footer">

            <a href="index.html">
                ~/collections
            </a>

        </div>

    </div>

</div>


<script>

/* =========================
   DATE / TIME
========================= */

function updateDate() {

    const now = new Date();

    const day = now.toLocaleDateString(undefined, {
        weekday: "long"
    });

    const date = now.toLocaleDateString(undefined, {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });

    const time = now.toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    });

    document.getElementById("date").textContent =
        `${day} ${time} | ${date}`;
}

updateDate();

setInterval(updateDate, 1000);


/* =========================
   KEYBOARD NAVIGATION
========================= */

const links = [
    ...document.querySelectorAll(".links a")
];


/* Spatial navigation */

function move(direction) {

    const currentLink = document.activeElement;

    if (!links.includes(currentLink)) {

        links[0].focus();

        return;
    }


    const currentRect =
        currentLink.getBoundingClientRect();

    const currentX =
        currentRect.left +
        currentRect.width / 2;

    const currentY =
        currentRect.top +
        currentRect.height / 2;


    let bestLink = null;
    let bestScore = Infinity;


    links.forEach(link => {

        if (link === currentLink)
            return;


        const rect =
            link.getBoundingClientRect();

        const x =
            rect.left +
            rect.width / 2;

        const y =
            rect.top +
            rect.height / 2;


        const dx = x - currentX;
        const dy = y - currentY;


        if (
            direction === "left" &&
            dx >= -5
        )
            return;

        if (
            direction === "right" &&
            dx <= 5
        )
            return;

        if (
            direction === "up" &&
            dy >= -5
        )
            return;

        if (
            direction === "down" &&
            dy <= 5
        )
            return;


        let score;


        if (
            direction === "left" ||
            direction === "right"
        ) {

            score =
                Math.abs(dx) +
                Math.abs(dy) * 2;

        } else {

            score =
                Math.abs(dy) +
                Math.abs(dx) * 2;
        }


        if (score < bestScore) {

            bestScore = score;
            bestLink = link;
        }

    });


    if (bestLink) {

        bestLink.focus();
    }
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", event => {

    switch (event.key) {

        case "ArrowLeft":
        case "h":

            event.preventDefault();

            move("left");

            break;


        case "ArrowRight":
        case "l":

            event.preventDefault();

            move("right");

            break;


        case "ArrowUp":
        case "k":

            event.preventDefault();

            move("up");

            break;


        case "ArrowDown":
        case "j":

            event.preventDefault();

            move("down");

            break;


        case "Enter":

            if (
                links.includes(
                    document.activeElement
                )
            ) {

                event.preventDefault();

                document.activeElement.click();
            }

            break;


        case "m":

            window.location.href =
                "index.html";

            break;


        case "Escape":

            window.location.href =
                "index.html";

            break;

    }

});

</script>

</body>
</html>
